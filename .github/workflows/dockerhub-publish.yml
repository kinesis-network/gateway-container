name: Publish versioned image to Docker Hub

on:
  push:
    tags:
      - 'v*'   # any tag starting with "v"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tag from git tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          IMAGE_TAG="${RAW_TAG#v}"
          if [ "$IMAGE_TAG" = "$RAW_TAG" ] || [ -z "$IMAGE_TAG" ]; then
            echo "Invalid tag: $RAW_TAG"
            exit 1
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Deliberately no :latest tag; kinesisorg/gateway-container:latest is left as is.
      - name: Build and push kinesisorg/gateway-container (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kinesisorg/gateway-container:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
